# uniffi-bindgen-react-native (ubrn) config for the wasm2 flavour.
# CI (.github/workflows/web.yml) checks out matrix-rust-sdk at the commit of
# ../sdk-version into rust_modules/ and applies patches/*.patch first.
rust:
  directory: rust_modules/matrix-rust-sdk
  manifestPath: bindings/matrix-sdk-ffi/Cargo.toml

wasm2:
  ts: src/generated
  defaultFeatures: false
  features:
    - js
    - indexeddb
    - unstable-msc4274

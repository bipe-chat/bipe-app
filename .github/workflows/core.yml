# Rust core spike (ADR 0267, bipe-chat/bipe#1172). Each job builds bipe-core for one client, loads the
# packaged artifact, runs bipe-shared test-vectors/badges.json through it and writes its numbers to the summary.
# No production client uses this library.
name: core

on:
  pull_request:
    paths:
      - "core/**"
      - "sdk-version"
      - ".github/workflows/core.yml"
      - ".github/workflows/core-release.yml"
      - "android/libraries/bipe/src/test/kotlin/chat/bipe/shared/BadgeVerifierBenchTest.kt"
      - "ios/BipeKit/Tests/BipeKitTests/BadgeVerifierBenchTests.swift"
  push:
    branches: [main]
    paths:
      - "core/**"
      - "sdk-version"
      - ".github/workflows/core.yml"
  workflow_dispatch:
  # core-release.yml builds the release artifacts with these jobs (bipe-chat/bipe#1277 item 4).
  workflow_call:
    inputs:
      version:
        description: Release version written into the artifact names
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name in a call, so a release build never cancels, or is cancelled by, a main push.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'core' }}

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"
  PROFILE: small-release-stripped
  UBRN_VERSION: 0.31.0-6
  BUDGET_NATIVE: 1048576
  BUDGET_WASM_BROTLI: 307200
  # The version in the names of the core-dist-* artifacts: the release's, or 0.0.0-dev on a pull request or push.
  DIST_VERSION: ${{ inputs.version || '0.0.0-dev' }}

jobs:
  rust:
    name: core-rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - &shared-branch
        name: bipe-shared branch
        id: shared
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/bipe-chat/bipe-shared "refs/heads/$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - &shared-checkout
        uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-shared
          path: bipe-shared
          ref: ${{ steps.shared.outputs.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Lockfiles
        working-directory: core
        run: |
          [ -f Cargo.lock ] || cargo generate-lockfile
          [ -f tools/uniffi-bindgen/Cargo.lock ] || cargo generate-lockfile --manifest-path tools/uniffi-bindgen/Cargo.toml
      # Agents have no Rust toolchain (bipe docs/agents/builds.md). When a manifest change needs a new lockfile,
      # this step shows cargo's own minimal change and the core-lockfiles artifact holds the file to commit.
      - name: Lockfile is current
        id: lock
        working-directory: core
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            cargo metadata --format-version 1 > /dev/null
            git diff Cargo.lock
            echo "::error file=core/Cargo.lock::Cargo.lock is stale. Commit Cargo.lock from the core-lockfiles artifact."
            echo "stale=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: core-lockfiles
          path: |
            core/Cargo.lock
            core/tools/uniffi-bindgen/Cargo.lock
      - name: Stop on a stale lockfile
        if: steps.lock.outputs.stale == '1'
        run: exit 1
      - name: Vectors against the crate
        working-directory: core
        env:
          BIPE_SHARED: ${{ github.workspace }}/bipe-shared
        run: cargo test --locked
      # bipe-chat/bipe#1277: core/shipped-crates.json names the packages that each client links, per platform.
      # tools/oss-licences.mjs puts these, and no build tool, in the app's notices.
      - name: Shipped graph
        id: shipped
        working-directory: core
        run: |
          shipped() {
            args=()
            for target in "$@"; do args+=(--target "$target"); done
            cargo tree --locked -p bipe-core -e normal,no-proc-macro --prefix none --no-dedupe "${args[@]}" \
              | grep -v -e '^bipe-core ' -e '^$' | cut -d' ' -f1 | LC_ALL=C sort -u | jq -R . | jq -sc .
          }
          jq -n \
            --arg comment "Written by .github/workflows/core.yml (cargo tree, normal dependencies, no proc macros). Do not edit: copy the core-shipped-crates artifact." \
            --argjson apple "$(shipped aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin x86_64-apple-darwin)" \
            --argjson android "$(shipped aarch64-linux-android armv7-linux-androideabi x86_64-linux-android)" \
            --argjson jvm "$(shipped x86_64-unknown-linux-gnu x86_64-pc-windows-msvc)" \
            --argjson web "$(shipped wasm32-unknown-unknown)" \
            '{"$comment": $comment, apple: $apple, android: $android, jvm: $jvm, web: $web}' > "$RUNNER_TEMP/shipped-crates.json"
          {
            echo '### Shipped graph (no build, dev or proc-macro dependencies)'
            echo
            echo '| Platform | Packages |'
            echo '| -------- | -------- |'
            jq -r 'to_entries[] | select(.key != "$comment") | "| \(.key) | \(.value | length) |"' "$RUNNER_TEMP/shipped-crates.json"
            echo
            echo '```'
            jq -r '[.apple, .android, .jvm, .web] | add | unique[]' "$RUNNER_TEMP/shipped-crates.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! diff -u shipped-crates.json "$RUNNER_TEMP/shipped-crates.json"; then
            echo "::error file=core/shipped-crates.json::differs from the shipped graph. Replace it with the core-shipped-crates artifact, then run node tools/oss-licences.mjs."
            echo "stale=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: core-shipped-crates
          path: ${{ runner.temp }}/shipped-crates.json
      - name: Licences
        working-directory: core
        run: |
          {
            echo
            echo '### Cargo licences'
            echo
            echo '| Package | Version | Licence |'
            echo '| ------- | ------- | ------- |'
            cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.source != null) | "| \(.name) | \(.version) | \(.license) |"' | sort
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          cargo metadata --locked --format-version 1 | jq '[.packages[] | select(.source != null) | {name, version, license, repository}]' > "$RUNNER_TEMP/cargo-licences.json"
      - uses: actions/upload-artifact@v4
        with:
          name: core-cargo-licences
          path: ${{ runner.temp }}/cargo-licences.json
      - name: Shipped graph is current
        if: steps.shipped.outputs.stale == '1'
        run: exit 1

  apple:
    name: core-apple
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - *shared-branch
      - *shared-checkout
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build each slice
        working-directory: core
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --locked -p bipe-core --profile "$PROFILE" --target "$target"
          done
      - name: Generate the Swift bindings
        working-directory: core
        run: |
          mkdir -p "$RUNNER_TEMP/swift-out" harness/swift/Sources/BipeCore/generated
          cargo run --locked --release --manifest-path tools/uniffi-bindgen/Cargo.toml -- generate \
            --library "target/aarch64-apple-darwin/$PROFILE/libbipe_core.dylib" --language swift --out-dir "$RUNNER_TEMP/swift-out"
          ls -la "$RUNNER_TEMP/swift-out"
          cp "$RUNNER_TEMP/swift-out/bipe_core.swift" harness/swift/Sources/BipeCore/generated/
      - name: Make the XCFramework
        working-directory: core
        run: |
          headers="$RUNNER_TEMP/headers"
          mkdir -p "$headers" harness/swift/build target/universal-macos
          cp "$RUNNER_TEMP/swift-out/bipe_coreFFI.h" "$headers/"
          cp "$RUNNER_TEMP/swift-out/bipe_coreFFI.modulemap" "$headers/module.modulemap"
          lipo -create "target/aarch64-apple-darwin/$PROFILE/libbipe_core.a" "target/x86_64-apple-darwin/$PROFILE/libbipe_core.a" -output target/universal-macos/libbipe_core.a
          xcodebuild -create-xcframework \
            -library "target/aarch64-apple-ios/$PROFILE/libbipe_core.a" -headers "$headers" \
            -library "target/aarch64-apple-ios-sim/$PROFILE/libbipe_core.a" -headers "$headers" \
            -library target/universal-macos/libbipe_core.a -headers "$headers" \
            -output harness/swift/build/bipe_coreFFI.xcframework
          cp "$GITHUB_WORKSPACE/bipe-shared/test-vectors/badges.json" harness/swift/Tests/BipeCoreHarnessTests/badges.json
      # The release form (core-release.yml): the zip that SwiftPM's binaryTarget takes, and the Swift bindings.
      - name: Package for SwiftPM
        working-directory: core
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          zip="$RUNNER_TEMP/dist/bipe_coreFFI-$DIST_VERSION.xcframework.zip"
          (cd harness/swift/build && ditto -c -k --sequesterRsrc --keepParent bipe_coreFFI.xcframework "$zip")
          cp harness/swift/Sources/BipeCore/generated/bipe_core.swift "$RUNNER_TEMP/dist/bipe_core-$DIST_VERSION.swift"
          echo "SwiftPM checksum: $(swift package compute-checksum "$zip")"
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist-apple
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      - name: Vectors on macOS, next to the Matrix SDK
        working-directory: core/harness/swift
        run: |
          swift test -c release -Xswiftc -enable-testing 2>&1 | tee "$RUNNER_TEMP/mac.log"
          grep -h BIPE_CORE_METRICS "$RUNNER_TEMP/mac.log" | head -1 > "$RUNNER_TEMP/mac.metrics"
          test -s "$RUNNER_TEMP/mac.metrics"
      # bipe-chat/bipe#1277 item 5: the x86_64 slice of the XCFramework, run on this arm64 Mac through Rosetta 2.
      - name: Vectors on macOS x86_64 (Rosetta), next to the Matrix SDK
        working-directory: core/harness/swift
        run: |
          arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license
          # swift test runs an arm64 helper that cannot open an x86_64 bundle, so xctest runs it under Rosetta.
          swift build -c release --arch x86_64 --build-tests -Xswiftc -enable-testing
          bundle=$(find .build -ipath '*release*' -name 'BipeCoreHarnessTests.xctest' -type d -newer Package.swift | head -1)
          test -n "$bundle"
          arch -x86_64 xcrun xctest "$bundle" 2>&1 | tee "$RUNNER_TEMP/mac-x86.log"
          file "$bundle/Contents/MacOS/"* | tee "$RUNNER_TEMP/mac-x86.file"
          grep -q 'x86_64' "$RUNNER_TEMP/mac-x86.file"
          if grep -q 'arm64' "$RUNNER_TEMP/mac-x86.file"; then echo "::error::the test bundle is not x86_64 only"; exit 1; fi
          grep -h BIPE_CORE_METRICS "$RUNNER_TEMP/mac-x86.log" | head -1 > "$RUNNER_TEMP/mac-x86.metrics"
          test -s "$RUNNER_TEMP/mac-x86.metrics"
      - name: Vectors on the iOS simulator, next to the Matrix SDK
        working-directory: core/harness/swift
        run: |
          id=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("iPhone"))][0].udid')
          echo "simulator $id"
          xcodebuild test -scheme BipeCoreHarness-Package -destination "platform=iOS Simulator,id=$id" -configuration Release ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/ios.log" | grep -E "BIPE_CORE_METRICS|error:|TEST (SUCCEEDED|FAILED)|\*\* " || true
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/ios.log"
          grep -h BIPE_CORE_METRICS "$RUNNER_TEMP/ios.log" | head -1 > "$RUNNER_TEMP/ios.metrics"
          test -s "$RUNNER_TEMP/ios.metrics"
      - name: Current verifier on macOS
        working-directory: ios/BipeKit
        env:
          BIPE_SHARED: ${{ github.workspace }}/bipe-shared
          BIPE_BENCH: "1"
        run: |
          swift test -c release -Xswiftc -enable-testing --filter BadgeVerifierBenchTests 2>&1 | tee "$RUNNER_TEMP/base.log" | tail -5
          grep -h BIPE_BASELINE_METRICS "$RUNNER_TEMP/base.log" | head -1 > "$RUNNER_TEMP/base.metrics"
          test -s "$RUNNER_TEMP/base.metrics"
      - name: Size added to a linked binary
        working-directory: core
        run: |
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe"
          cp harness/swift/size-probe.swift "$probe/main.swift"
          link() { # sdk triple target
            sdk=$(xcrun --sdk "$1" --show-sdk-path)
            xcrun swiftc -O -wmo -sdk "$sdk" -target "$2" -parse-as-library -Xlinker -dead_strip -o "$probe/base-$3" "$probe/empty-main.swift"
            xcrun swiftc -O -wmo -sdk "$sdk" -target "$2" -I "$RUNNER_TEMP/headers" -L "target/$3/$PROFILE" -lbipe_core \
              -Xlinker -dead_strip -o "$probe/core-$3" "$probe/main.swift" harness/swift/Sources/BipeCore/generated/bipe_core.swift
            strip -x "$probe/base-$3" "$probe/core-$3"
            base=$(stat -f %z "$probe/base-$3"); core=$(stat -f %z "$probe/core-$3")
            echo "| $3 | $((core - base)) | $(stat -f %z "target/$3/$PROFILE/libbipe_core.dylib" 2>/dev/null || echo -) |" >> "$probe/table"
          }
          printf '@main struct Empty { static func main() { print(CommandLine.arguments.count) } }\n' > "$probe/empty-main.swift"
          : > "$probe/table"
          link iphoneos arm64-apple-ios17.0 aarch64-apple-ios
          link macosx arm64-apple-macos14.0 aarch64-apple-darwin
          link macosx x86_64-apple-macos14.0 x86_64-apple-darwin
          {
            echo '### Apple'
            echo
            echo "Budget per slice: $BUDGET_NATIVE bytes."
            echo
            echo '| Slice | Bytes added to a stripped linked binary | Stripped dylib bytes |'
            echo '| ----- | --------------------------------------- | -------------------- |'
            cat "$probe/table"
            echo
            echo '| Run | Metrics |'
            echo '| --- | ------- |'
            echo "| macOS, bipe-core | $(cat "$RUNNER_TEMP/mac.metrics") |"
            echo "| macOS x86_64 under Rosetta, bipe-core | $(cat "$RUNNER_TEMP/mac-x86.metrics") |"
            echo "| iOS simulator, bipe-core | $(cat "$RUNNER_TEMP/ios.metrics") |"
            echo "| macOS, BadgeVerifier.swift | $(cat "$RUNNER_TEMP/base.metrics") |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  android:
    name: core-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - *shared-branch
      - *shared-checkout
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build each ABI
        working-directory: core
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o harness/android/bipecore/src/main/jniLibs build --locked -p bipe-core --profile "$PROFILE"
      - name: Generate the Kotlin bindings
        working-directory: core
        run: |
          cargo build --locked -p bipe-core --profile "$PROFILE"
          cargo run --locked --release --manifest-path tools/uniffi-bindgen/Cargo.toml -- generate \
            --library "target/$PROFILE/libbipe_core.so" --language kotlin --out-dir harness/android/bipecore/src/main/kotlin/generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the AAR
        working-directory: core/harness/android
        run: |
          ../../../android/gradlew --no-daemon :bipecore:assembleRelease
          mkdir -p harness/src/androidTest/assets
          cp "$GITHUB_WORKSPACE/bipe-shared/test-vectors/badges.json" harness/src/androidTest/assets/badges.json
          unzip -l bipecore/build/outputs/aar/bipecore-release.aar
          mkdir -p "$RUNNER_TEMP/dist"
          cp bipecore/build/outputs/aar/bipecore-release.aar "$RUNNER_TEMP/dist/bipe-core-$DIST_VERSION.aar"
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist-android
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vectors on the emulator, next to the Matrix SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: core/harness/android
          script: |
            adb logcat -c
            ../../../android/gradlew --no-daemon :harness:connectedDebugAndroidTest --stacktrace
            adb logcat -d | grep BIPE_CORE_METRICS | head -1 | sed 's/.*BIPE_CORE_METRICS/BIPE_CORE_METRICS/' > /tmp/android.metrics
            adb logcat -d | grep BIPE_BASELINE_METRICS | head -1 | sed 's/.*BIPE_BASELINE_METRICS/BIPE_BASELINE_METRICS/' > /tmp/android-emulator-base.metrics
      - name: Current verifier on the JVM
        working-directory: android
        env:
          BIPE_SHARED: ${{ github.workspace }}/bipe-shared
          BIPE_BENCH: /tmp/android-base.metrics
        run: ./gradlew --no-daemon :libraries:bipe:testDebugUnitTest --tests '*BadgeVerifierBenchTest*'
      - name: Report
        working-directory: core/harness/android/bipecore/src/main/jniLibs
        run: |
          test -s /tmp/android.metrics
          {
            echo '### Android'
            echo
            echo "Budget per slice: $BUDGET_NATIVE bytes."
            echo
            echo '| ABI | Stripped .so bytes | gzip -9 |'
            echo '| --- | ------------------ | ------- |'
            for f in */libbipe_core.so; do
              echo "| ${f%%/*} | $(stat -c %s "$f") | $(gzip -9c "$f" | wc -c) |"
            done
            echo
            echo '| Run | Metrics |'
            echo '| --- | ------- |'
            echo "| x86_64 emulator, API 34, debug build, bipe-core | $(cat /tmp/android.metrics) |"
            echo "| x86_64 emulator, API 34, debug build, BadgeVerifier.kt | $(cat /tmp/android-emulator-base.metrics) |"
            echo "| JVM on this runner, BadgeVerifier.kt | $(cat /tmp/android-base.metrics) |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  jvm:
    name: core-jvm-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - *shared-branch
      - *shared-checkout
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build the library and the Kotlin bindings
        working-directory: core
        run: |
          cargo build --locked -p bipe-core --profile "$PROFILE"
          lib="target/$PROFILE/libbipe_core.so"
          [ -f "$lib" ] || lib="target/$PROFILE/bipe_core.dll"
          echo "library $lib"
          echo "BIPE_CORE_LIB=$PWD/$lib" >> "$GITHUB_ENV"
          echo "BIPE_CORE_LIB_DIR=$PWD/target/$PROFILE" >> "$GITHUB_ENV"
          cargo run --locked --release --manifest-path tools/uniffi-bindgen/Cargo.toml -- generate \
            --library "$lib" --language kotlin --out-dir harness/jvm/generated
      # The JVM jar of a release (job jvm-jar) takes the library in JNA's resource layout and the bindings.
      - name: Natives for the jar
        working-directory: core
        run: |
          case "$RUNNER_OS" in
            Linux) prefix=linux-x86-64 ;;
            Windows) prefix=win32-x86-64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/natives/natives/$prefix"
          cp "$BIPE_CORE_LIB" "$RUNNER_TEMP/natives/natives/$prefix/"
          if [ "$RUNNER_OS" = Linux ]; then cp -r harness/jvm/generated "$RUNNER_TEMP/natives/generated"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: core-jvm-natives-${{ matrix.os }}
          path: ${{ runner.temp }}/natives
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Vectors on the JVM through JNA
        working-directory: core/harness/jvm
        env:
          BIPE_VECTORS: ${{ github.workspace }}/bipe-shared/test-vectors/badges.json
        run: |
          ../../../android/gradlew --no-daemon run | tee "$RUNNER_TEMP/jvm.log"
          grep -h BIPE_CORE_METRICS "$RUNNER_TEMP/jvm.log" | head -1 > "$RUNNER_TEMP/jvm.metrics"
          test -s "$RUNNER_TEMP/jvm.metrics"
      - name: Report
        run: |
          {
            echo "### JVM on ${{ matrix.os }}"
            echo
            echo "Budget per slice: $BUDGET_NATIVE bytes."
            echo
            echo "- Library bytes: $(wc -c < "$BIPE_CORE_LIB")"
            echo "- $(cat "$RUNNER_TEMP/jvm.metrics")"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  jvm-jar:
    name: core-jvm-jar
    needs: jvm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - *shared-branch
      - *shared-checkout
      - uses: actions/download-artifact@v4
        with:
          pattern: core-jvm-natives-*
          path: core/release/jvm
          merge-multiple: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the jar
        working-directory: core/release/jvm
        run: |
          ../../../android/gradlew --no-daemon jar -PbipeCoreVersion="$DIST_VERSION"
          unzip -l "build/libs/bipe-core-jvm-$DIST_VERSION.jar"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "build/libs/bipe-core-jvm-$DIST_VERSION.jar" "$RUNNER_TEMP/dist/"
      - name: Vectors through the jar, no library path
        working-directory: core/harness/jvm
        env:
          BIPE_CORE_JAR: ${{ runner.temp }}/dist/bipe-core-jvm-${{ env.DIST_VERSION }}.jar
          BIPE_VECTORS: ${{ github.workspace }}/bipe-shared/test-vectors/badges.json
          BIPE_ED25519_CASES: ${{ github.workspace }}/core/harness/ed25519-cases.json
        run: |
          ../../../android/gradlew --no-daemon run | tee "$RUNNER_TEMP/jar.log"
          grep -q BIPE_CORE_METRICS "$RUNNER_TEMP/jar.log"
          echo "### JVM jar: $(grep -h BIPE_CORE_METRICS "$RUNNER_TEMP/jar.log" | head -1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist-jvm
          path: ${{ runner.temp }}/dist
          if-no-files-found: error

  web:
    name: core-web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions: read, to take the matrix-sdk-ffi module from the last web.yml run on main.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - *shared-branch
      - *shared-checkout
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-web
          path: bipe-web
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: wasm-bindgen version
        working-directory: core
        run: |
          wb="$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)"
          echo "wasm-bindgen ${wb:-none}"
          echo "WASM_BINDGEN_VERSION=$wb" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        if: env.WASM_BINDGEN_VERSION != ''
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Install ubrn
        run: |
          if ! cargo install --list | grep -q "^uniffi-bindgen-react-native v.*$UBRN_VERSION"; then
            cargo install --locked --force --git https://github.com/jhugman/uniffi-bindgen-react-native --tag "$UBRN_VERSION" uniffi-bindgen-react-native
          fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: core/harness/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install harness dependencies
        working-directory: core/harness/web
        run: pnpm install --frozen-lockfile
      - name: Build the WASM package
        working-directory: core/harness/web
        run: |
          uniffi-bindgen-react-native build wasm2 --config ubrn.config.yaml --profile "$PROFILE"
          ls -la generated
          for f in generated/*.wasm; do
            wasm-tools strip --all -o "$f.stripped" "$f"
            mv "$f.stripped" "$f"
          done
      - name: Package the web module
        working-directory: core/harness/web
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          tar -czf "$RUNNER_TEMP/dist/bipe-core-web-$DIST_VERSION.tgz" -C generated .
          tar -tzf "$RUNNER_TEMP/dist/bipe-core-web-$DIST_VERSION.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist-web
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
      - name: Vectors in Node
        working-directory: core/harness/web
        run: |
          pnpm exec esbuild run.ts --bundle --platform=node --format=esm --outfile=build/run.mjs \
            --banner:js="import { createRequire } from 'node:module'; const require = createRequire(import.meta.url);"
          node build/run.mjs "$GITHUB_WORKSPACE/bipe-shared/test-vectors/badges.json" "$PWD/$(ls generated/*.wasm | head -1)" | tee "$RUNNER_TEMP/web.log"
          grep -h BIPE_CORE_METRICS "$RUNNER_TEMP/web.log" | head -1 > "$RUNNER_TEMP/web.metrics"
          test -s "$RUNNER_TEMP/web.metrics"
      # bipe-chat/bipe#1277 item 6: the web client's matrix-sdk-ffi module (web.yml artifact web-bindings, main).
      - name: The matrix-sdk-ffi module of the web client
        working-directory: core/harness/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run" || { echo "::error::No successful web.yml run on main: run it (gh workflow run web.yml --ref main)."; exit 1; }
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name web-bindings --dir sdk-generated
          echo "SDK_RUN=$run" >> "$GITHUB_ENV"
          ls -la sdk-generated
      - name: Vectors in Chromium, Firefox and WebKit, next to the SDK
        working-directory: core/harness/web
        run: |
          mkdir -p build/page
          pnpm exec esbuild browser.ts --bundle --format=esm --platform=browser --external:node:* --outfile=build/page/browser.mjs
          cp index.html "$GITHUB_WORKSPACE/bipe-shared/test-vectors/badges.json" build/page/
          cp "$(ls generated/*.wasm | head -1)" build/page/core.wasm
          cp sdk-generated/matrix_sdk_ffi.wasm build/page/sdk.wasm
          pnpm exec playwright install --with-deps chromium firefox webkit
          python3 -m http.server 8787 --bind 127.0.0.1 --directory build/page > "$RUNNER_TEMP/http.log" 2>&1 &
          until curl -sf http://127.0.0.1:8787/index.html > /dev/null; do sleep 1; done
          node browsers.mjs http://127.0.0.1:8787/index.html | tee "$RUNNER_TEMP/browsers.log"
      - name: Current website verifier in Node
        working-directory: core/harness/web
        run: |
          pnpm exec esbuild baseline.ts --bundle --platform=node --format=esm --outfile=build/baseline.mjs \
            --alias:@web/badge="$GITHUB_WORKSPACE/bipe-web/src/badge.ts" --alias:@shared="$GITHUB_WORKSPACE/bipe-shared"
          node build/baseline.mjs "$GITHUB_WORKSPACE/bipe-shared/test-vectors/badges.json" | tee "$RUNNER_TEMP/base.log"
          grep -h BIPE_BASELINE_METRICS "$RUNNER_TEMP/base.log" | head -1 > "$RUNNER_TEMP/base.metrics"
          test -s "$RUNNER_TEMP/base.metrics"
      - name: Report
        working-directory: core/harness/web
        run: |
          command -v brotli > /dev/null || sudo apt-get install -y -qq brotli
          mkdir -p "$RUNNER_TEMP/pack"
          pnpm exec esbuild generated/index.ts --bundle --minify --format=esm --external:node:* --outfile="$RUNNER_TEMP/pack/bindings.mjs"
          cp generated/*.wasm "$RUNNER_TEMP/pack/"
          {
            echo '### Web'
            echo
            echo "Budget: $BUDGET_WASM_BROTLI bytes Brotli."
            echo
            echo '| File | Bytes | brotli -q 11 |'
            echo '| ---- | ----- | ------------ |'
            total=0
            for f in "$RUNNER_TEMP"/pack/*.wasm "$RUNNER_TEMP"/pack/*.mjs; do
              b=$(brotli -q 11 -c "$f" | wc -c)
              total=$((total + b))
              echo "| $(basename "$f") | $(stat -c %s "$f") | $b |"
            done
            echo "| Total | | $total |"
            echo
            echo '| Run | Metrics |'
            echo '| --- | ------- |'
            echo "| Node 24, bipe-core | $(cat "$RUNNER_TEMP/web.metrics") |"
            echo "| Node 24, bipe-web src/badge.ts | $(cat "$RUNNER_TEMP/base.metrics") |"
            echo
            echo "Browsers, one page with bipe-core and matrix-sdk-ffi (web.yml run $SDK_RUN):"
            echo
            echo '```'
            grep -h BIPE_CORE_METRICS "$RUNNER_TEMP/browsers.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  # bipe-chat/bipe#1172 step 4. The answer may be no, and that is a result of the spike, so a failure here does
  # not fail the workflow. The summary says what happened.
  combined:
    name: core-combined
    # Not part of a release build (core-release.yml).
    if: github.workflow == 'core'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/spike/combined
      - name: The SDK's lockfile
        working-directory: core/spike/combined
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rev=$(grep -oE 'rev = "[0-9a-f]{40}"' Cargo.toml | head -1 | cut -d'"' -f2)
          version="$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/sdk-version")"
          gh release view "$version" --repo matrix-org/matrix-rust-components-swift --json body --jq .body | grep -q "$rev" \
            || { echo "::error::Cargo.toml names $rev, which is not the commit of sdk-version $version"; exit 1; }
          curl -fsSL "https://raw.githubusercontent.com/matrix-org/matrix-rust-sdk/$rev/Cargo.lock" -o Cargo.lock
      - name: Build one library with both
        working-directory: core/spike/combined
        run: cargo build --profile "$PROFILE"
      - name: Check both sets of exports in one library
        working-directory: core/spike/combined
        run: |
          lib="target/$PROFILE/libbipe_combined.so"
          core=$(nm -D --defined-only "$lib" | grep -c ' uniffi_bipe_core_fn_')
          sdk=$(nm -D --defined-only "$lib" | grep -c ' uniffi_matrix_sdk_ffi_fn_')
          test "$core" -gt 0
          test "$sdk" -gt 0
          python3 -c "
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          print('contract', lib.ffi_bipe_core_uniffi_contract_version(), lib.ffi_matrix_sdk_ffi_uniffi_contract_version())
          " "$PWD/$lib"
          cargo run --locked --release --manifest-path ../../tools/uniffi-bindgen/Cargo.toml -- generate \
            --library "$lib" --language kotlin --out-dir "$RUNNER_TEMP/combined-kotlin"
          find "$RUNNER_TEMP/combined-kotlin" -name '*.kt' | sed "s#$RUNNER_TEMP/combined-kotlin/##" | head -20
          {
            echo '### One library with bipe-core and matrix-sdk-ffi'
            echo
            echo "- Linux x86_64, no SDK fork. The workspace repeats the SDK's [patch.crates-io] list and uses its Cargo.lock."
            echo "- Library bytes: $(stat -c %s "$lib")"
            echo "- Exported functions: bipe-core $core, matrix-sdk-ffi $sdk"
            echo "- Bindings generated from it: $(find "$RUNNER_TEMP/combined-kotlin" -name '*.kt' | wc -l) Kotlin files"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

name: macos
on:
  pull_request:
    paths: ["macos/**", "ios/BipeKit/**", "ios/Bipe/Common/Listeners.swift", "ios/Package.resolved", "sdk-version", ".github/workflows/macos.yml"]
  push:
    branches: [main]
    paths: ["macos/**", "ios/BipeKit/**", "ios/Bipe/Common/Listeners.swift", "ios/Package.resolved", "sdk-version", ".github/workflows/macos.yml"]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
jobs:
  build:
    name: macos (${{ matrix.configuration }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Mac project
        working-directory: macos
        run: xcodegen generate
      - name: Use the existing Swift package pins
        run: |
          dir=macos/BipeMac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$dir"
          cp ios/Package.resolved "$dir/Package.resolved"
      - name: Build both Mac architectures
        shell: bash
        run: |
          set -o pipefail
          bipe_version_settings=$(node tools/version.mjs --xcodebuild)
          xcodebuild build -project macos/BipeMac.xcodeproj -scheme BipeMac \
            -configuration '${{ matrix.configuration }}' -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/bipe-mac" ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO $bipe_version_settings \
            > "$RUNNER_TEMP/macos-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/macos-build.log"; exit 1; }
          bipe_archs=" $(lipo -archs "$RUNNER_TEMP/bipe-mac/Build/Products/${{ matrix.configuration }}/BipeMac.app/Contents/MacOS/BipeMac") "
          echo "$bipe_archs"
          [[ "$bipe_archs" == *" arm64 "* && "$bipe_archs" == *" x86_64 "* ]]
      - name: SDK loading, encrypted storage and session tests
        if: matrix.configuration == 'Debug'
        shell: bash
        run: |
          xcodebuild test -project macos/BipeMac.xcodeproj -scheme BipeMac \
            -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/bipe-mac-tests" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM='' \
            -resultBundlePath "$RUNNER_TEMP/macos-tests.xcresult" \
            > "$RUNNER_TEMP/macos-tests.log" 2>&1 || { tail -120 "$RUNNER_TEMP/macos-tests.log"; exit 1; }
      - name: Confirm the resolved SDK pin
        shell: bash
        run: |
          node tools/sdk-version.mjs
          expected=$(cat sdk-version)
          actual=$(jq -r '.pins[] | select(.identity == "matrix-rust-components-swift") | .state.version' macos/BipeMac.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
          test "$actual" = "$expected"
      - name: Package the spike
        if: matrix.configuration == 'Release'
        run: |
          app="$RUNNER_TEMP/bipe-mac/Build/Products/Release/BipeMac.app"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Bipe-Mac-spike.zip"
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: bipe-mac-spike
          path: ${{ runner.temp }}/Bipe-Mac-spike.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.configuration }}-logs
          path: |
            ${{ runner.temp }}/macos-*.log
            ${{ runner.temp }}/macos-tests.xcresult

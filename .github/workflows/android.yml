# Android build (bipe-chat/bipe#549): debug and release APKs. The release APK is
# debug-signed (bipe-chat/bipe#575). The debug APK is uploaded as bipe-debug-apk; the
# tester APK of chat.bipe.app.next comes from testflight.yml. Flavours (ADR 0150): play
# (Block Store) is the tester and store build; foss has no Google Play services and is
# built here so it keeps compiling.
name: android

on:
  pull_request:
    paths:
      - "android/**"
      - "sdk-version"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "sdk-version"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-shared
          path: bipe-shared
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared vector tests (bipe-chat/bipe#576)
        env:
          BIPE_SHARED: ${{ github.workspace }}/bipe-shared
        run: ./gradlew --no-daemon :libraries:bipe:testDebugUnitTest
      - name: Build debug and release (play and foss)
        run: ./gradlew --no-daemon assembleDebug assembleRelease
      # The store ID set (bipe-chat/bipe#602): the fork's application ID (ADR 0061), never uploaded before the switch.
      - name: Build release with the store ID set
        run: ./gradlew --no-daemon assemblePlayRelease -PbipeIdSet=store
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bipe-debug-apk
          path: android/app/build/outputs/apk/play/debug/*.apk
          retention-days: 14

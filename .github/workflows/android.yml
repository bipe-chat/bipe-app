# Android build (bipe-chat/bipe#549): debug and release APKs. The release APK is
# debug-signed (bipe-chat/bipe#575). The debug APK is uploaded as bipe-debug-apk; the
# tester APK of chat.bipe.app.next comes from testflight.yml. Flavours (ADR 0150): play
# (Block Store) is the tester and store build; foss has no Google Play services and is
# built here so it keeps compiling.
name: android

on:
  pull_request:
    paths:
      - "android/**"
      - "sdk-version"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "sdk-version"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      # The build number counts the commits (tools/version.mjs), so the job needs the full history and the tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The bipe-shared branch of the same name when it exists, else main (bipe-shared AGENTS.md): a change that
      # adds vectors in bipe-shared and their tests here is green before bipe-shared merges.
      - name: bipe-shared branch
        id: shared
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/bipe-chat/bipe-shared "refs/heads/$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-shared
          path: bipe-shared
          ref: ${{ steps.shared.outputs.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared vector tests (bipe-chat/bipe#576)
        env:
          BIPE_SHARED: ${{ github.workspace }}/bipe-shared
        run: ./gradlew --no-daemon :libraries:bipe:testDebugUnitTest
      # The version name, build number and commit, as the tester build has them, so the debug APK of a PR shows
      # its build on the welcome cover and in Settings instead of the placeholder 0.1.0 (1).
      - name: Build debug and release (play and foss)
        run: ./gradlew --no-daemon assembleDebug assembleRelease $(node ../tools/version.mjs --gradle)
      # The store ID set (bipe-chat/bipe#602): the fork's application ID (ADR 0061), never uploaded before the switch.
      # The Play bundle of the store release (bipe-chat/bipe#604), debug-signed here: store-release.yml signs and uploads it.
      - name: Build release and the store AAB with the store ID set
        run: ./gradlew --no-daemon assemblePlayRelease bundlePlayRelease -PbipeIdSet=store
      # Artifact storage (bipe-chat org quota): one debug APK is about 136 MB and each push makes one. Keep 2 days.
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bipe-debug-apk
          path: android/app/build/outputs/apk/play/debug/*.apk
          retention-days: 2

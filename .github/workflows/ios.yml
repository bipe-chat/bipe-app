# iOS build (bipe-chat/bipe#549). XcodeGen makes the project from ios/project.yml.
# The build uses the package pins in ios/Package.resolved and fails when SwiftPM
# resolves other pins. No code signing: CI only proves that the app builds.
name: ios

on:
  # Every pull request runs this workflow, so the required check "ios (required)" always reports.
  # The changes job skips the builds when no iOS path changed.
  pull_request:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "sdk-version"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # True when the change touches ios/, sdk-version or this workflow. A push to main has these paths already.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: iOS paths
        id: paths
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -qE '^(ios/|sdk-version$|\.github/workflows/ios\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: ios (${{ matrix.configuration }}${{ matrix.ids == 'store' && ', store IDs' || '' }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        ids: [next]
        # The store ID set (bipe-chat/bipe#602): the fork's IDs (ADR 0061), unsigned, never uploaded before the switch.
        include:
          - configuration: Release
            ids: store
            settings: BIPE_APP_ID=chat.bipe.app BIPE_APP_GROUP=group.chat.bipe BIPE_SHARE_ID_SUFFIX=shareextension BIPE_DISPLAY_NAME=Bipe
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Use the committed package pins
        run: |
          dir=ios/Bipe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$dir"
          cp ios/Package.resolved "$dir/Package.resolved"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Bipe.xcodeproj \
            -scheme Bipe \
            -configuration "${{ matrix.configuration }}" \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO ${{ matrix.settings }} | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "error:|warning: .*Bipe|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"
      - name: Resolved pins equal ios/Package.resolved
        run: |
          pins='[.pins[] | {identity, version: .state.version, revision: .state.revision}] | sort_by(.identity)'
          diff <(jq -S "$pins" ios/Package.resolved) \
               <(jq -S "$pins" ios/Bipe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved)
      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-${{ matrix.configuration }}-${{ matrix.ids }}.log
          path: ${{ runner.temp }}/xcodebuild.log

  # BipeKit unit tests (bipe-chat/bipe#576): the shared vectors of bipe-shared on macOS.
  bipekit-tests:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: ios (BipeKit tests)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The bipe-shared branch of the same name when it exists, else main (bipe-shared AGENTS.md): a change that
      # adds vectors in bipe-shared and their tests here is green before bipe-shared merges.
      - name: bipe-shared branch
        id: shared
        working-directory: .
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/bipe-chat/bipe-shared "refs/heads/$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: bipe-chat/bipe-shared
          path: bipe-shared
          ref: ${{ steps.shared.outputs.ref }}
      - name: Xcode version
        run: xcodebuild -version
      - name: swift test
        working-directory: ios/BipeKit
        env:
          BIPE_SHARED: ${{ github.workspace }}/bipe-shared
        run: swift test

  # The required check on main (bipe-chat/bipe-app#337 merged with the iOS builds red). Green when
  # every iOS job passed or was skipped because no iOS path changed.
  required:
    name: ios (required)
    needs: [changes, build, bipekit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every iOS job passed or was skipped
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.build.result }}" "${{ needs.bipekit-tests.result }}"; do
            case "$result" in success|skipped) ;; *) echo "::error::an iOS job ended with: $result"; exit 1 ;; esac
          done

# Tester builds (bipe-chat/bipe#575, ADR 0147). Every push to main:
# - iOS: archive with manual signing by the team's existing distribution certificate (secrets
#   DIST_CERT_P12, DIST_CERT_PASSWORD; bipe-chat/bipe#585) and profiles made through the App
#   Store Connect API, upload to TestFlight and add the build to the internal testing group;
#   also export an ad hoc IPA for the devices registered in team 992N457T8D (artifact
#   bipe-next-ipa). The job never makes a certificate: automatic signing made a development
#   certificate on every run until the team reached Apple's limit.
# - Android: a debug-signed release APK of chat.bipe.app.next (artifact bipe-next-apk).
# Version (bipe-chat/bipe#584, ADR 0088): the version name of bipe-shared product/version.json;
# build number: its build plus the run number. Both platforms carry the same pair.
# Install commands: AGENTS.md, "Tester builds".
name: testflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: 992N457T8D

jobs:
  build-number:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.n.outputs.number }}
      version: ${{ steps.n.outputs.version }}
    steps:
      - id: n
        run: |
          curl -fsSL https://raw.githubusercontent.com/bipe-chat/bipe-shared/main/product/version.json > version.json
          base=$(jq -er '.build' version.json)
          version=$(jq -er '.version' version.json)
          echo "number=$((base + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version, build number: $((base + GITHUB_RUN_NUMBER))"

  ios:
    needs: build-number
    runs-on: macos-26
    timeout-minutes: 120
    env:
      BUILD_NUMBER: ${{ needs.build-number.outputs.number }}
      VERSION_NAME: ${{ needs.build-number.outputs.version }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Write the API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Register the bundle IDs, check the app record
        id: asc
        run: node tools/asc.mjs prepare
      - name: Report the development certificates
        # Report only (bipe-chat/bipe#585): MZ revokes the ones the old runs made.
        continue-on-error: true
        run: node tools/asc.mjs certificates
      - name: Import the distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          if [ -z "$DIST_CERT_P12" ] || [ -z "$DIST_CERT_PASSWORD" ]; then
            echo "::error::Secrets DIST_CERT_P12 and DIST_CERT_PASSWORD are not set (bipe-chat/bipe#585)."
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -f pkcs12 -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          serial=$(security find-certificate -c "Apple Distribution" -p "$keychain" | openssl x509 -noout -serial | cut -d= -f2)
          if [ -z "$serial" ]; then
            echo "::error::The .p12 in DIST_CERT_P12 holds no Apple Distribution certificate."
            exit 1
          fi
          echo "DIST_CERT_SERIAL=$serial" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain"
      - name: Make the profiles and export options
        run: node tools/asc.mjs signing "$DIST_CERT_SERIAL"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen generate
      - name: Use the committed package pins
        run: |
          dir=ios/Bipe.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$dir"
          cp ios/Package.resolved "$dir/Package.resolved"
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Bipe.xcodeproj \
            -scheme Bipe \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            -archivePath "$RUNNER_TEMP/Bipe.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BIPE_SIGN_STYLE=Manual \
            BIPE_SIGN_IDENTITY="Apple Distribution" \
            BIPE_CI_PROFILE_APP="$BIPE_CI_PROFILE_APP" \
            BIPE_CI_PROFILE_NSE="$BIPE_CI_PROFILE_NSE" \
            BIPE_CI_PROFILE_SHARE="$BIPE_CI_PROFILE_SHARE" \
            BIPE_APS_ENVIRONMENT=production \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"
      - name: Upload to TestFlight
        if: steps.asc.outputs.app == 'true'
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bipe.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)|Upload" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/upload.log"
      - name: Export the ad hoc IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bipe.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/adhoc.plist" \
            -exportPath "$RUNNER_TEMP/adhoc" 2>&1 | tee "$RUNNER_TEMP/adhoc.log" | grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/adhoc.log"
          mv "$RUNNER_TEMP"/adhoc/*.ipa "$RUNNER_TEMP/adhoc/Bipe-Next-${BUILD_NUMBER}.ipa"
      - name: Keep the ad hoc IPA
        uses: actions/upload-artifact@v4
        with:
          name: bipe-next-ipa
          path: ${{ runner.temp }}/adhoc/*.ipa
          retention-days: 30
      - name: Add the build to the internal testing group
        if: steps.asc.outputs.app == 'true'
        run: node tools/asc.mjs distribute "$BUILD_NUMBER"
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: ${{ runner.temp }}/*.log
      - name: Remove the API key, the keychain and the profiles
        if: always()
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dist.p12"
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"

  android:
    needs: build-number
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the tester APK
        run: |
          ./gradlew --no-daemon assembleRelease -PbipeBuildNumber=${{ needs.build-number.outputs.number }} -PbipeVersionName=${{ needs.build-number.outputs.version }}
          mv app/build/outputs/apk/release/*.apk "app/build/outputs/apk/release/Bipe-Next-${{ needs.build-number.outputs.number }}.apk"
      - name: Keep the tester APK
        uses: actions/upload-artifact@v4
        with:
          name: bipe-next-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

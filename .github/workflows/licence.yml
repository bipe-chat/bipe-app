# Licence gates (bipe-chat/bipe#548). See AGENTS.md, "Checks".
name: licence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: licence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tools/*.test.mjs

  deny-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/deny-list.mjs

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/licences.mjs

  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/headers.mjs

  strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/strings.mjs

  sdk-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/sdk-version.mjs

  similarity:
    runs-on: ubuntu-latest
    env:
      JPLAG_VERSION: 6.3.0
      JPLAG_SHA256: 5f2c21e8b88ed77134effcb3a5a3ab13d188f6a3e16d401387f7479e92db9aa2
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Download JPlag
        run: |
          curl -fsSL -o "$RUNNER_TEMP/jplag.jar" "https://github.com/jplag/JPlag/releases/download/v${JPLAG_VERSION}/jplag-${JPLAG_VERSION}-jar-with-dependencies.jar"
          echo "${JPLAG_SHA256}  $RUNNER_TEMP/jplag.jar" | sha256sum -c -
      - name: Self-test (a copied file must fail)
        run: node tools/similarity.mjs self-test --jar "$RUNNER_TEMP/jplag.jar"
      # A pull request scans only the platforms whose non-generated source it changes; a push to main
      # scans both. The two scans run at the same time.
      - name: Scan iOS and Android against Element X
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed() {
            [ -z "$BASE" ] && return 0
            git diff --name-only "$BASE" HEAD -- "$1" | grep -E "\\.$2\$" | grep -v -E '/(Generated|generated)/' | grep -q .
          }
          pids=""
          if changed ios swift; then
            node tools/similarity.mjs scan --lang swift --ours ios --repo element-hq/element-x-ios --jar "$RUNNER_TEMP/jplag.jar" > "$RUNNER_TEMP/ios.log" 2>&1 &
            pids="$pids $!"
          else
            echo "::notice title=similarity::No iOS source changed: iOS scan skipped."
          fi
          if changed android kt; then
            node tools/similarity.mjs scan --lang kotlin --ours android --repo element-hq/element-x-android --jar "$RUNNER_TEMP/jplag.jar" > "$RUNNER_TEMP/android.log" 2>&1 &
            pids="$pids $!"
          else
            echo "::notice title=similarity::No Android source changed: Android scan skipped."
          fi
          status=0
          for pid in $pids; do wait "$pid" || status=1; done
          for log in "$RUNNER_TEMP/ios.log" "$RUNNER_TEMP/android.log"; do [ -f "$log" ] && cat "$log"; done
          exit $status

name: BipeMac
options:
  developmentLanguage: pt-BR
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
packages:
  MatrixRustSDK:
    url: https://github.com/matrix-org/matrix-rust-components-swift
    exactVersion: 26.08.11
  BipeKit:
    path: ../ios/BipeKit
targets:
  BipeMac:
    productName: Bipe
    type: application
    platform: macOS
    sources:
      - path: BipeMac
      - path: QRCode/qrcodegen.c
      - path: QRCode/Nayuki-LICENSE.txt
        buildPhase: resources
      - path: ../ios/Bipe/Common/Listeners.swift
      - path: ../ios/Bipe/Common/ButtonSize.swift
      - path: ../ios/BipeKit/Sources/BipeKit/Generated/AppIcons.xcassets
      - path: ../ios/Phosphor/Sources/Phosphor/Resources/Phosphor.xcassets
      - path: ../ios/Phosphor/LICENSE
        buildPhase: resources
    info:
      path: SupportFiles/Info.plist
      properties:
        CFBundleDisplayName: Bipe
        CFBundleName: Bipe
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: Copyright 2026 Bipe contributors
    settings:
      base:
        PRODUCT_NAME: Bipe
        PRODUCT_MODULE_NAME: BipeMac
        PRODUCT_BUNDLE_IDENTIFIER: chat.bipe.app.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: BipeMac/BipeMac-Bridging-Header.h
    dependencies:
      - package: MatrixRustSDK
      - package: BipeKit
  BipeMacTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.bipe.app.mac.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BipeMac
schemes:
  BipeMac:
    build:
      targets:
        BipeMac: all
        BipeMacTests: [test]
    test:
      targets: [BipeMacTests]

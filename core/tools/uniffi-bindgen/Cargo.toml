# The bindings generator is a build tool. It is its own workspace, so its
# dependencies stay out of ../../Cargo.lock and out of the apps.
[package]
name = "uniffi-bindgen"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs.git", rev = "e5f4821410bea19e71984ea5e06a7bc8b11ed9e5", version = "0.31.0", features = ["cli"] }

[workspace]

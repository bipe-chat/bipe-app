# bipe-core (ADR 0267). This lockfile holds only what ships in the apps.
# tools/uniffi-bindgen, spike/combined and fuzz are separate workspaces, so the build
# tool and the Matrix SDK do not enter tools/licences.json through this file.
[workspace]
members = ["crates/bipe-core"]
exclude = ["tools/uniffi-bindgen", "spike/combined", "fuzz"]
resolver = "3"

# The name matches the Matrix SDK profile and the ubrn command in web.yml.
[profile.small-release-stripped]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
lto = true
codegen-units = 1

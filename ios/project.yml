# XcodeGen spec of the iOS app (bipe-chat/bipe#549). Run `xcodegen generate` in ios/.
# IDs: ADR 0147. Tester builds use their own IDs (chat.bipe.app.next, group.chat.bipe.next),
# so they sit next to the fork on one phone. At the switch the app takes the fork's IDs (ADR 0061).
# The matrix-rust-components-swift version must equal ../sdk-version (tools/sdk-version.mjs).
name: Bipe

options:
  # pt-BR is the default language, en the second one. Without this XcodeGen sets the project's
  # development region (DEVELOPMENT_LANGUAGE, knownRegions) to en, and iOS falls back to it
  # when no preferred language of the phone matches a localization.
  developmentLanguage: pt-BR
  # iOS 18: the SwiftUI Tab API with the search tab role (spec app-tabs, ADR 0053).
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    # Placeholders. Every build passes the real values from `node tools/version.mjs --xcodebuild` (ADR 0088):
    # the version name of version.json (ADR 0163), its build plus the commit count, and the commit.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    BIPE_COMMIT: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Signing (bipe-chat/bipe#575): automatic, team Centaur Labs (ADR 0061). The tester build
    # (testflight.yml, bipe-chat/bipe#585) signs manually with the existing distribution
    # certificate: it sets BIPE_SIGN_STYLE, BIPE_SIGN_IDENTITY and BIPE_CI_PROFILE_*, which only
    # the three targets read, so the Swift package targets keep their own settings. Unset, the
    # profile names are empty and automatic signing applies.
    DEVELOPMENT_TEAM: 992N457T8D
    CODE_SIGN_STYLE: Automatic
    BIPE_SIGN_STYLE: Automatic
    BIPE_SIGN_IDENTITY: Apple Development
    # Name under the home screen icon. Tester builds are "Bipe Next" (ADR 0147). At the switch
    # to the fork's IDs (ADR 0061) this becomes "Bipe". All three targets read it.
    BIPE_DISPLAY_NAME: Bipe Next
    # ID set (bipe-chat/bipe#602, docs/client-switch-plan.md step 2). Tester builds: chat.bipe.app.next.
    # The store set (the fork's IDs, ADR 0061) passes BIPE_APP_ID=chat.bipe.app BIPE_APP_GROUP=group.chat.bipe
    # BIPE_DISPLAY_NAME=Bipe on the xcodebuild command line; CI builds it unsigned and never uploads it before the switch.
    # The extension IDs derive from BIPE_APP_ID: .nse, and .$(BIPE_SHARE_ID_SUFFIX) for the share extension. The fork's
    # registered share ID is chat.bipe.app.shareextension (App Store Connect API, 25 Oct 2026), so the store set also
    # passes BIPE_SHARE_ID_SUFFIX=shareextension.
    # The "Report the store IDs" step of testflight.yml (node tools/asc.mjs store-ids) lists the fork's real IDs.
    BIPE_APP_ID: chat.bipe.app.next
    BIPE_APP_GROUP: group.chat.bipe.next
    BIPE_SHARE_ID_SUFFIX: share

packages:
  MatrixRustSDK:
    url: https://github.com/matrix-org/matrix-rust-components-swift
    exactVersion: 26.08.11
  # Calls (spec call, ADR 0186): LiveKit client SDK, Apache-2.0, with its WebRTC build. Pins in Package.resolved.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.18.0
  BipeKit:
    path: BipeKit
  Phosphor:
    path: Phosphor

targets:
  Bipe:
    type: application
    platform: iOS
    sources:
      - path: Bipe
      # bipe-chat/bipe#512: the Focus filter's titles are App Intents metadata, read from the app bundle's Bipe table.
      - path: BipeKit/Sources/BipeKit/Resources
        buildPhase: resources
      # Spec app-colors (bipe-chat/bipe#811): the app icon of each palette, generated from bipe-shared design/tokens.json.
      - path: BipeKit/Sources/BipeKit/Generated/AppIcons.xcassets
        buildPhase: resources
    info:
      path: SupportFiles/Bipe/Info.plist
      properties:
        CFBundleDisplayName: $(BIPE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BipeCommit: $(BIPE_COMMIT)
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        # Credential mutations always name this own group; the other groups are read-only (ADR 0147). Since
        # bipe-chat/bipe#531 the own group is the app-group keychain group: it has no Team ID, so the items survive the
        # App Store transfer (bipe/docs/team-transfer-recovery.md). The Team-ID group before it and the fork's group are
        # read-only, and BipeKeychainMove copies their items into the own group at launch.
        BipeOwnedKeychainGroup: $(BIPE_APP_GROUP)
        BipeAppID: $(BIPE_APP_ID)
        BipeAppGroup: $(BIPE_APP_GROUP)
        BipeLegacyKeychainReadGroups: [$(AppIdentifierPrefix)$(BIPE_APP_ID), 992N457T8D.chat.bipe.app.dev]
        UILaunchScreen: {}
        # Group and person links from other apps (spec room-link-open): the matrix: scheme. iOS opens only verified
        # universal links, so https://matrix.to from other apps stays in the browser, which offers the matrix: link.
        CFBundleURLTypes:
          - CFBundleURLName: chat.bipe.matrix
            CFBundleURLSchemes: [matrix]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Spec contacts (ADR 0015): bipe_contacts_intro in pt-BR, the development language.
        NSContactsUsageDescription: Veja quem dos seus contatos já está no Bipe. O servidor só compara os números e não guarda nenhum.
        # App lock, the owner checks of settings (spec app-lock, pin-change, data-export) and device approval (device-verification).
        NSFaceIDUsageDescription: O Bipe usa o Face ID para abrir o app e para confirmar que é você.
        # The shell encrypts nothing itself. Revisit before end-to-end encryption ships.
        ITSAppUsesNonExemptEncryption: false
        # Voice messages play on with the screen locked (spec voice-message notes), and a call goes on in the background (spec call).
        # voip: PushKit and CallKit ring a locked phone (spec incoming-call, bipe-chat/bipe#760). The notification service
        # extension hands a ring to the app with CXProvider.reportNewIncomingVoIPPushPayload; no VoIP pusher on the server.
        # location: a live location share goes on with the screen locked, only with "Always" (spec location-send, bipe-chat/bipe#768).
        UIBackgroundModes: [audio, voip, location]
        # Media viewer save (spec media-viewer). The system shows this text with the add-only photo permission.
        NSPhotoLibraryAddUsageDescription: O Bipe salva na sua galeria as fotos e os vídeos que você escolher salvar.
        # Composer (specs attachment-picker, voice-recording), calls (spec call). The transcript is made on this iPhone only (ADR 0023).
        # One key for every camera use: video calls, the composer, and the QR codes of link-computer-scan and signup-invite-code.
        # The texts are bipe-shared bipe_call_camera_usage and bipe_call_microphone_usage (pt-BR, the development language).
        NSCameraUsageDescription: O Bipe usa a câmera nas chamadas de vídeo, para fotos e vídeos nas conversas e para ler QR codes, como o do computador ou de um convite.
        NSMicrophoneUsageDescription: O Bipe usa o microfone nas chamadas e quando você grava uma mensagem de voz ou um vídeo.
        NSSpeechRecognitionUsageDescription: O Bipe transcreve suas mensagens de voz neste iPhone, sem enviar o áudio para nenhum servidor.
        # Spec location-send (bipe-chat/bipe#768): "when in use" at the first send; "Always" only when a live share starts.
        # The texts are bipe-shared bipe_app_location_when_in_use_usage and bipe_app_location_always_usage (pt-BR).
        NSLocationWhenInUseUsageDescription: O Bipe usa sua localização quando você envia onde está numa conversa ou compartilha sua localização em tempo real.
        NSLocationAlwaysAndWhenInUseUsageDescription: Quando você compartilha sua localização em tempo real numa conversa, o Bipe continua enviando onde você está com a tela bloqueada, até o fim do tempo que você escolheu.
    entitlements:
      path: SupportFiles/Bipe/Bipe.entitlements
      properties:
        com.apple.security.application-groups: [$(BIPE_APP_GROUP)]
        # Pushes through Bipe's Sygnal (spec push-registration). Export for TestFlight and ad hoc
        # signs with the production environment; the tester archive sets it (BIPE_APS_ENVIRONMENT).
        aps-environment: $(BIPE_APS_ENVIRONMENT)
        # The Team-ID group, then the fork's group (ADR 0147): the app reads the device account that the fork stored
        # (BipeKit BipeCredentialStore) and never writes there. The app-group keychain group comes from
        # com.apple.security.application-groups above; the app writes there (bipe-chat/bipe#531).
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BIPE_APP_ID)
          - 992N457T8D.chat.bipe.app.dev
        # App Attest at sign-up (spec signup-create, ADR 0022). Automatic signing adds the capability.
        com.apple.developer.devicecheck.appattest-environment: production
        # Profile links open in the app (spec profile-link-open). The site serves the association file.
        com.apple.developer.associated-domains: [applinks:bipe.chat, applinks:www.bipe.chat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIPE_APP_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(BIPE_CI_PROFILE_APP)
        CODE_SIGN_STYLE: $(BIPE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(BIPE_SIGN_IDENTITY)
        BIPE_APS_ENVIRONMENT: development
        # BipeKit Generated/AppIcons.xcassets (bipe-shared appThemes): AppIcon is açaí; every other icon set there is an
        # alternate icon for UIApplication.setAlternateIconName (spec app-colors).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    dependencies:
      - package: MatrixRustSDK
        product: MatrixRustSDK
      - package: LiveKit
        product: LiveKit
      - package: BipeKit
        product: BipeKit
      - package: Phosphor
        product: Phosphor
      - target: BipeNotificationService
      - target: BipeShare
    scheme: {}

  # Notification service extension (spec notification-service): fetches and decrypts the event of a
  # content-free push. It opens the account from the store in the app group, so it compiles the app's
  # session files too; keep those free of app-only types.
  BipeNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Bipe/Common/AppConfig.swift
      - path: Bipe/Account/AccountSession.swift
      - path: Bipe/Account/AccountStep.swift
      - path: Bipe/Account/SessionStore.swift
      - path: Bipe/Notifications/NotificationKeys.swift
    info:
      path: SupportFiles/BipeNotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(BIPE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        BipeAppID: $(BIPE_APP_ID)
        BipeAppGroup: $(BIPE_APP_GROUP)
        # SessionStore writes refreshed sessions into the app-group keychain group (bipe-chat/bipe#531).
        BipeOwnedKeychainGroup: $(BIPE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: SupportFiles/BipeNotificationService/BipeNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [$(BIPE_APP_GROUP)]
        # The app's Team-ID group, for sessions saved before the app-group move; SessionStore reads the app-group
        # keychain group first (bipe-chat/bipe#531).
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(BIPE_APP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIPE_APP_ID).nse
        PROVISIONING_PROFILE_SPECIFIER: $(BIPE_CI_PROFILE_NSE)
        CODE_SIGN_STYLE: $(BIPE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(BIPE_SIGN_IDENTITY)
    dependencies:
      - package: MatrixRustSDK
        product: MatrixRustSDK
      - package: BipeKit
        product: BipeKit

  # Share extension: Conferir no Bipe (specs pix-check-receive and pix-check-result, bipe-chat/bipe#581).
  # The check and its result run inside the extension, signed out and offline.
  BipeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Bipe/PixCheck
      - path: Bipe/Share/ShareHandoff.swift
      - path: Bipe/Common/AppConfig.swift
      - path: Bipe/Common/RoundedType.swift
      - path: Bipe/Common/ButtonSize.swift
      - path: Bipe/Common/AppTheme.swift
    info:
      path: SupportFiles/BipeShare/Info.plist
      properties:
        CFBundleDisplayName: $(BIPE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        BipeAppID: $(BIPE_APP_ID)
        BipeAppGroup: $(BIPE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Spec share-to-chat: text, a web link, photos, videos and files; the app takes at most 10 items.
            # Conferir no Bipe (spec pix-check-receive) reads only the text and images.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: SupportFiles/BipeShare/BipeShare.entitlements
      properties:
        com.apple.security.application-groups: [$(BIPE_APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BIPE_APP_ID).$(BIPE_SHARE_ID_SUFFIX)
        PROVISIONING_PROFILE_SPECIFIER: $(BIPE_CI_PROFILE_SHARE)
        CODE_SIGN_STYLE: $(BIPE_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(BIPE_SIGN_IDENTITY)
    dependencies:
      - package: BipeKit
        product: BipeKit
      - package: Phosphor
        product: Phosphor

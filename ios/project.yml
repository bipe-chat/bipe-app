# XcodeGen spec of the iOS app (bipe-chat/bipe#549). Run `xcodegen generate` in ios/.
# IDs: ADR 0147. Tester builds use their own IDs (chat.bipe.app.next, group.chat.bipe.next),
# so they sit next to the fork on one phone. At the switch the app takes the fork's IDs (ADR 0061).
# The matrix-rust-components-swift version must equal ../sdk-version (tools/sdk-version.mjs).
name: Bipe

options:
  # pt-BR is the default language, en the second one. Without this XcodeGen sets the project's
  # development region (DEVELOPMENT_LANGUAGE, knownRegions) to en, and iOS falls back to it
  # when no preferred language of the phone matches a localization.
  developmentLanguage: pt-BR
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # Signing (bipe-chat/bipe#575): automatic, team Centaur Labs (ADR 0061). CI signs with
    # the App Store Connect API key (.github/workflows/testflight.yml).
    DEVELOPMENT_TEAM: 992N457T8D
    CODE_SIGN_STYLE: Automatic
    # Name under the home screen icon. Tester builds are "Bipe Next" (ADR 0147). At the switch
    # to the fork's IDs (ADR 0061) this becomes "Bipe". All three targets read it.
    BIPE_DISPLAY_NAME: Bipe Next

packages:
  MatrixRustSDK:
    url: https://github.com/matrix-org/matrix-rust-components-swift
    exactVersion: 26.08.11
  BipeKit:
    path: BipeKit
  Phosphor:
    path: Phosphor

targets:
  Bipe:
    type: application
    platform: iOS
    sources:
      - path: Bipe
    info:
      path: SupportFiles/Bipe/Info.plist
      properties:
        CFBundleDisplayName: $(BIPE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # App lock and the owner checks of settings (spec app-lock, pin-change, data-export).
        NSFaceIDUsageDescription: O Bipe usa o Face ID para abrir o app e para confirmar que é você.
        # The shell encrypts nothing itself. Revisit before end-to-end encryption ships.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: SupportFiles/Bipe/Bipe.entitlements
      properties:
        com.apple.security.application-groups: [group.chat.bipe.next]
        # The app's own group first, then the fork's group (ADR 0147): the app reads the device
        # account that the fork stored (BipeKit BipeCredentialStore) and never writes there.
        keychain-access-groups:
          - $(AppIdentifierPrefix)chat.bipe.app.next
          - 992N457T8D.chat.bipe.app.dev
        # App Attest at sign-up (spec signup-create, ADR 0022). Automatic signing adds the capability.
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.bipe.app.next
        # Bipe/Assets.xcassets, from Bipe artwork (bipe-web public/brand/app-icon.svg).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MatrixRustSDK
        product: MatrixRustSDK
      - package: BipeKit
        product: BipeKit
      - package: Phosphor
        product: Phosphor
      - target: BipeNotificationService
      - target: BipeShare
    scheme: {}

  # Empty notification service extension. Decryption of pushes on the device comes later.
  BipeNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
    info:
      path: SupportFiles/BipeNotificationService/Info.plist
      properties:
        CFBundleDisplayName: $(BIPE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: SupportFiles/BipeNotificationService/BipeNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.chat.bipe.next]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.bipe.app.next.nse

  # Empty share extension. Sharing into a chat comes later.
  BipeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: SupportFiles/BipeShare/Info.plist
      properties:
        CFBundleDisplayName: $(BIPE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR, en]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: SupportFiles/BipeShare/BipeShare.entitlements
      properties:
        com.apple.security.application-groups: [group.chat.bipe.next]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.bipe.app.next.share

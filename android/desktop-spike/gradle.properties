# The standalone project does not inherit ../gradle.properties. Generated SDK
# bindings need more than Gradle/Kotlin's default heap on the Windows CI runner.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=2

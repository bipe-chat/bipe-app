# Same namespace, library and checksum policy as the pinned SDK. JVM cleanup uses
# Java's Cleaner instead of the Android API; neither the SDK nor its Rust code is patched.
[bindings.kotlin]
package_name = "org.matrix.rustcomponents.sdk"
cdylib_name = "matrix_sdk_ffi"
android_cleaner = false
omit_checksums = true
